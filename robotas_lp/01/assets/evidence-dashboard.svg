  <text x="646" y="353" fill="#169AB0" font-size="18" font-family="Arial, Helvetica, sans-serif">何を優先して改善すべきか</text>
  <text x="646" y="407" fill="#D46B3A" font-size="18" font-family="Arial, Helvetica, sans-serif">運動・作業改善・補助具をどう組み合わせるか</text>

