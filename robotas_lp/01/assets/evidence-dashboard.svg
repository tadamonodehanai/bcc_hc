  <text x="628" y="570" fill="#657187" font-size="16" font-family="Arial, Helvetica, sans-serif">運動指導・作業改善・補助具活用を設計</text>
  <text x="892" y="500" fill="#2E72FF" font-size="16" font-family="Arial, Helvetica, sans-serif">STEP 4</text>
  <text x="892" y="534" fill="#091936" font-size="26" font-family="Arial, Helvetica, sans-serif">継続支援</text>
  <text x="892" y="570" fill="#657187" font-size="16" font-family="Arial, Helvetica, sans-serif">実行と定着まで伴走</text>
