  <text x="100" y="500" fill="#2E72FF" font-size="16" font-family="Arial, Helvetica, sans-serif">STEP 1</text>
  <text x="100" y="534" fill="#091936" font-size="26" font-family="Arial, Helvetica, sans-serif">状態把握</text>
  <text x="100" y="570" fill="#657187" font-size="16" font-family="Arial, Helvetica, sans-serif">身体機能・認知機能・作業負荷を確認</text>
  <text x="364" y="500" fill="#2E72FF" font-size="16" font-family="Arial, Helvetica, sans-serif">STEP 2</text>
  <text x="364" y="534" fill="#091936" font-size="26" font-family="Arial, Helvetica, sans-serif">論点整理</text>
  <text x="364" y="570" fill="#657187" font-size="16" font-family="Arial, Helvetica, sans-serif">離職・安全・継続就業との関係を整理</text>
