  <rect x="336" y="458" width="244" height="162" rx="24" fill="#FAFCFF" stroke="#DDE7F1"/>
  <rect x="600" y="458" width="244" height="162" rx="24" fill="#FAFCFF" stroke="#DDE7F1"/>
