  <text x="72" y="124" fill="#657187" font-size="18" font-family="Arial, Helvetica, sans-serif">身体機能・認知機能・作業負荷を整理し、優先順位の高い打ち手を設計する</text>

  <rect x="72" y="164" width="486" height="236" rx="26" fill="#FAFCFF" stroke="#DDE7F1"/>
