<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>できないことがあるなら、できる方法を探せばいい｜二階喜美子｜特集 高齢社会と、これからの介護レク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF3EF; --paper-2:#F5E7E0; --white:#FFFFFF;
  --rule:#E7D6CE; --rule-2:#D8C0B5;
  --ink:#2B2320; --ink-2:#6E5A54;
  --pink:#F0546C; --pink-deep:#A83250; --pink-pale:#FDECEE; --gold:#B99A2E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Kaku Gothic New","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
  background:#E9DBD4;color:var(--ink);letter-spacing:.04em;line-height:2.0}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:auto}

.tool{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;padding:12px 22px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;line-height:1.6}
.tool .ttl{font-size:14px;font-weight:700;letter-spacing:.08em}
.tool .lb{font-size:11px;letter-spacing:.12em;opacity:.65;margin-right:6px}
.tool button{font-family:inherit;font-size:13px;color:#fff;background:transparent;
  border:1px solid rgba(255,255,255,.4);padding:6px 14px;cursor:pointer;margin-right:6px}
.tool button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);font-weight:700}
.tool .hint{font-size:12px;opacity:.6;margin-left:auto}

.stage{padding:30px 20px 80px;display:flex;justify-content:center}
.device{background:var(--paper);border:1px solid var(--rule-2);width:100%}
body[data-dev="pc"] .device{max-width:1100px}
body[data-dev="sp"] .device{max-width:390px;border-width:8px;border-color:var(--ink);border-radius:6px}

.chrome{background:var(--paper-2);border-bottom:1px solid var(--rule);color:var(--ink-2);
  font-size:12px;letter-spacing:.06em;padding:12px 24px;line-height:1.6}
.chrome.foot{border-bottom:none;border-top:1px solid var(--rule)}
body[data-dev="sp"] .chrome{padding:10px 14px;font-size:11px}

.label{display:inline-block;background:var(--pink-deep);color:#fff;font-size:13px;font-weight:700;
  letter-spacing:.1em;padding:4px 14px;line-height:1.7}
body[data-dev="sp"] .label{font-size:12px;padding:3px 11px}
.ph{background:var(--paper-2);border:1px solid var(--rule);display:flex;align-items:center;
  justify-content:center;color:var(--ink-2);font-size:12px;line-height:1.6;text-align:center;padding:6px}

/* Index */
.hero{padding:56px 40px 46px;text-align:center;background:var(--white);border-bottom:1px solid var(--rule)}
body[data-dev="sp"] .hero{padding:32px 16px 28px}
.badge-day{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-size:14px;font-weight:700;
  letter-spacing:.1em;padding:7px 18px;line-height:1.6;margin-bottom:22px}
body[data-dev="sp"] .badge-day{font-size:12px;padding:5px 13px}
.hero h1{font-size:42px;font-weight:900;line-height:1.5;margin-bottom:14px}
body[data-dev="sp"] .hero h1{font-size:26px}
.hero h1 em{font-style:normal;color:var(--pink-deep)}
.hero .sub{font-size:16px;color:var(--ink-2);line-height:1.9;margin-bottom:30px}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:660px;margin:0 auto}
body[data-dev="sp"] .faces{grid-template-columns:1fr 1fr;gap:8px}
.faces .ph{height:150px}
body[data-dev="sp"] .faces .ph{height:96px}
.faces .real{overflow:hidden;height:150px}
body[data-dev="sp"] .faces .real{height:96px}
.faces .real img{height:100%;object-fit:cover}
.idx-lead{padding:40px 60px;background:var(--white);border-bottom:1px solid var(--rule)}
body[data-dev="sp"] .idx-lead{padding:22px 16px}
.idx-lead p{font-size:18px;line-height:2.0}
body[data-dev="sp"] .idx-lead p{font-size:17px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:40px}
body[data-dev="sp"] .cards{grid-template-columns:1fr;gap:16px;padding:18px 16px}
.card{background:var(--white);border:1px solid var(--rule);display:block}
.card:hover{border-color:var(--pink)}
.card .ph{height:200px;border:none;border-bottom:1px solid var(--rule)}
.card .body{padding:22px 24px 26px}
body[data-dev="sp"] .card .body{padding:16px}
.card h2{font-size:24px;font-weight:700;line-height:1.5;margin:12px 0 2px}
.card .yomi{font-size:14px;color:var(--ink-2);line-height:1.7}
.card .role{font-size:15px;color:var(--ink-2);line-height:1.8;margin-top:8px;padding-top:12px;border-top:1px solid var(--rule)}
.card .hook{font-size:17px;line-height:1.95;margin-top:14px}
.card .more{display:block;margin-top:18px;border:1px solid var(--pink-deep);color:var(--pink-deep);
  text-align:center;font-size:16px;font-weight:700;padding:14px;line-height:1.6}
.card:hover .more{background:var(--pink-deep);color:#fff}

/* 記事 */
.crumb{background:var(--pink-deep);color:#fff;font-size:14px;padding:12px 40px;letter-spacing:.06em;line-height:1.7}
body[data-dev="sp"] .crumb{font-size:12px;padding:10px 16px}
.art{background:var(--white)}
.art-head{padding:50px 60px 34px;border-bottom:1px solid var(--rule)}
body[data-dev="sp"] .art-head{padding:26px 16px 20px}
.art-head h1{font-size:34px;font-weight:900;line-height:1.65;margin:14px 0 22px}
body[data-dev="sp"] .art-head h1{font-size:24px;margin:12px 0 16px}
.byline{font-size:16px;color:var(--ink-2);line-height:1.9}
body[data-dev="sp"] .byline{font-size:14px}
.byline strong{color:var(--ink);font-size:19px;font-weight:700}
.col{padding:0 0 46px}
.inner{max-width:680px;margin:0 auto;padding:0 60px}
body[data-dev="sp"] .inner{padding:0 16px;max-width:none}
.art-lead{padding:34px 0;font-size:18px;line-height:2.05;border-bottom:1px solid var(--rule)}
body[data-dev="sp"] .art-lead{font-size:17px;padding:22px 0}
.chap{padding:36px 0 0}
body[data-dev="sp"] .chap{padding:26px 0 0}
.chap .num{font-size:13px;letter-spacing:.14em;color:var(--pink-deep);font-weight:700;line-height:1.6}
.chap h3{font-size:25px;font-weight:700;line-height:1.65;margin:8px 0 20px;padding-left:16px;border-left:5px solid var(--pink)}
body[data-dev="sp"] .chap h3{font-size:21px;margin:6px 0 14px;padding-left:12px;border-left-width:4px}
.chap p{font-size:18px;line-height:2.05;margin-bottom:1.3em}
body[data-dev="sp"] .chap p{font-size:17px;line-height:2.0}
blockquote{border-top:1px solid var(--pink);border-bottom:1px solid var(--pink);
  padding:30px 0;margin:42px 0;font-size:26px;font-weight:700;line-height:1.9;letter-spacing:.03em}
body[data-dev="sp"] blockquote{font-size:21px;padding:24px 0;margin:32px 0;line-height:1.85}
figure{margin:36px 0}
body[data-dev="sp"] figure{margin:26px -16px}
figcaption{font-size:15px;color:var(--ink-2);line-height:1.85;padding-top:12px}
body[data-dev="sp"] figcaption{font-size:14px;padding:10px 16px 0}
.msg{border:2px solid var(--pink);padding:30px 34px;margin-top:42px}
body[data-dev="sp"] .msg{padding:20px 18px;margin-top:30px}
.msg .t{font-size:13px;letter-spacing:.12em;color:var(--pink-deep);font-weight:700;margin-bottom:12px;line-height:1.6}
.msg p{font-size:19px;line-height:2.05}
body[data-dev="sp"] .msg p{font-size:17px}
.prof{background:var(--paper);border:1px solid var(--rule);padding:28px 30px;margin-top:42px;display:flex;gap:24px}
body[data-dev="sp"] .prof{flex-direction:column;gap:14px;padding:20px 18px}
.prof .pic{width:120px;flex:none}
body[data-dev="sp"] .prof .pic{width:96px}
.prof h4{font-size:21px;font-weight:700;line-height:1.6}
.prof dl{margin-top:12px;font-size:15px;line-height:1.9}
.prof dt{color:var(--pink-deep);font-weight:700;font-size:13.5px;letter-spacing:.06em;margin-top:9px}
.next{margin-top:46px}
.next .t{font-size:17px;font-weight:700;margin-bottom:16px;line-height:1.7}
.next .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
body[data-dev="sp"] .next .row{gap:10px}
.next .item{border:1px solid var(--rule);padding:14px;display:block}
body[data-dev="sp"] .next .item{padding:9px}
.next .ph{height:100px;margin-bottom:12px}
body[data-dev="sp"] .next .ph{height:64px;margin-bottom:8px}
.next .item h5{font-size:17px;font-weight:700;line-height:1.6;margin-top:9px}
body[data-dev="sp"] .next .item h5{font-size:14px}
.share{margin-top:42px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
body[data-dev="sp"] .share{grid-template-columns:1fr 1fr;gap:8px}
.share div{border:1px solid var(--rule-2);color:var(--ink-2);text-align:center;font-size:15px;padding:15px;line-height:1.6}
.cta{margin-top:14px;background:var(--pink-deep);color:#fff;text-align:center;font-size:17px;font-weight:700;
  padding:20px;letter-spacing:.06em;line-height:1.6;display:block}
.back{margin-top:14px;border:1px solid var(--rule-2);color:var(--ink-2);text-align:center;font-size:16px;
  padding:17px;line-height:1.6;display:block}

.ogpbox{max-width:1100px;margin:0 auto 26px;background:var(--white);border:1px solid var(--rule-2);padding:26px 30px}
.ogpbox h2{font-size:18px;font-weight:700;color:var(--pink-deep);margin-bottom:6px;line-height:1.6}
.ogpbox p{font-size:14px;color:var(--ink-2);line-height:1.85;margin-bottom:16px}
.ogpbox .img{max-width:520px;border:1px solid var(--rule)}
</style>
</head>
<body data-dev="pc">

<div class="tool">
  <span class="ttl">二階さん記事｜実データ版</span>
  <span><span class="lb">DEVICE</span>
    <button data-dev-btn="pc" aria-pressed="true">PC</button>
    <button data-dev-btn="sp" aria-pressed="false">SP</button></span>
  <span><span class="lb">PAGE</span>
    <button data-go="index" aria-pressed="false">Index</button>
    <button data-go="art" aria-pressed="true">記事</button>
    <button data-go="ogp" aria-pressed="false">OGP</button></span>
  <span class="hint">写真5カット・本文確定稿</span>
</div>

<div class="stage"><div id="root" style="width:100%;display:flex;justify-content:center"></div></div>

function article(){return `
<div class="device">
  <div class="chrome">協会サイト共通ヘッダー（既存流用）</div>
  <div class="crumb"><a href="#" data-go="index">特集｜高齢社会と、これからの介護レク</a>　＞　二階 喜美子</div>
  <div class="art">
    <div class="art-head">
      <span class="label">当事者性</span>
      <h1>できないことがあるなら、<br>できる方法を探せばいい</h1>
      <div class="byline"><strong>二階 喜美子</strong>　にかい きみこ<br>一般社団法人日本アクティブコミュニティ協会 認定講師／音楽療法士</div>
    </div>
    <img src="${IMG.mv}" alt="二階喜美子さん">
    <div class="col"><div class="inner">

      <div class="art-lead"><p>2020年9月、二階喜美子さんはスーパーで買い物をしている最中に突然倒れた。そこから50日間の寝たきり生活が始まる。音楽療法士として、レクリエーション介護士として、高齢者を支える側に立ちつづけてきた人が、支えられる側になった。その50日が、いまのプログラムの土台になっている。</p></div>

      <div class="chap">
        <div class="num">01</div>
        <h3>「音活クラブ」という時間</h3>
        <p>フリーランスとして高齢者施設や障がい者施設に出向き、独自のプログラム「音活クラブ」を年間約250件のペースで実施している。地域で暮らす元気な高齢者に向けて、フレイルやMCIの予防をテーマにした教室の講師も務める。</p>
        <p>音活クラブには、毎回決まった流れがある。「はじまりの歌」で活動の開始を意識してもらい、一人ひとりと楽器を使って挨拶を交わす。手作りの万年カレンダーで日にちを確認し、季節の歌や馴染みの歌を歌い、クールダウンと「終わりの歌」で締める。</p>
        <p>「この固定の流れがあることで、いつもの時間が始まったという安心感を持っていただけると思うんです」</p>
        <p>その上に、毎回変わるメインプログラムを重ねる。季節や時事の話題を取り入れ、楽器やスカーフ、小物を使う。歌うだけで終わらせず、「やってみたい」「参加してみたい」と思える仕掛けをつくる。</p>
        <p>音楽療法士でもある二階さんは、音楽療法とレクリエーションの違いをこう説明する。音楽療法は、対象者のニーズや目標に合わせて音楽を意図的・計画的に用いる支援。一方でレクリエーションは、音楽を楽しみながら気分転換をしたり人と交流したりすること自体に意味がある。音活クラブは、その両方を組み合わせている。</p>
        <p>たとえば歩行の練習に音楽を使う場合、リズムを歩行の手がかりにするのが音楽の専門性を活かしたアプローチだ。そこにレクリエーションの要素を加えるなら——歩く途中に「水たまり」をつくる。飛び越えてみましょう、というルールを添える。</p>
        <p>「そうすると、ただの練習ではなくなって、やってみたいなという気持ちが生まれてくるんです」</p>
        <p>体を動かす、脳を使う、人と関わる。フレイル予防の3本柱を、音楽の力で自然に引き出す。そこに「次はどうなるんだろう」というワクワク感を加えていく。</p>
      </div>

      <figure>
        <img src="${IMG.c5}" alt="聞き手に向かって話す二階さん">
        <figcaption>音活クラブの流れを、身振りを交えて説明する二階さん。「はじまりの歌」から「終わりの歌」まで、順を追って話してくれた。</figcaption>
      </figure>

      <div class="chap">
        <div class="num">02</div>
        <h3>幸せのミルフィーユ</h3>
        <p>活動を始めた頃と比べて、変わったと感じることは何か。そう尋ねると、二階さんは「参加される方の好みが、すごく多様になった」と答えた。</p>
        <p>以前は壁飾りの制作など、静かに取り組むレクリエーションが多かった。いまは体を動かしたり、みんなで参加したりする活動への関心も高まっている。何より変わったのは、音楽のリクエストだという。</p>
        <p>ある時、NHKの朝ドラのテーマソングをリクエストされた。近年のものには、若い世代が歌うラップに近いアップテンポの曲もある。</p>
        <p>「正直、練習しないとついていけないんです。最初は、こういう曲が受け入れられるのかなと不安もありました。でも実際にやってみたら、なんのなんの。毎日テレビから流れてくる曲だから、自然と耳馴染みになっているんですね」</p>
        <p>口ずさむ参加者の姿を見た。マドンナやレディー・ガガのTシャツを着て参加する男性もいる。顔を見るなり「これ見てみ、ええやろ」と満面の笑顔で見せに来てくれる。</p>
        <p>「高齢者だからこういう音楽が好きだろうと、ひとくくりにはできません。高齢者の方も一人の人間ですから、当然お一人おひとりに好みがありますよね」</p>
        <p>では、二階さんにとって介護レクリエーションとは何なのか。「楽しい」「気晴らし」以外の言葉で説明するとしたら。</p>
        <p>「一言で言うなら、生きがいだと思っています。もう少し言葉を足すなら、生きる活力の再生でしょうか」</p>
        <p>そしてもう一つ、独自の表現がある。</p>
      </div>

      <blockquote>「歌う、体を動かす、人と関わる。できて嬉しい、誰かに見てもらえて嬉しい。そういう小さな喜びが何層にも重なって、その人の一日を支えていく。幸せのミルフィーユです」</blockquote>

      <figure>
        <img src="${IMG.c2}" alt="身振りを交えて話す二階さん">
        <figcaption>参加者から「毎日来てよ」「待ちわびすぎてキリンさんの首になったわ」と言われることもある。</figcaption>
      </figure>

      <div class="chap">
        <p>折込チラシで折り紙を折って持ってきてくれる方は、チラシの模様まで選んでいた。「これが私の生きがいなのよ」と言われた。トイレットペーパーの芯と紙コップでつくった、二階さん考案の「万能カップ」を気に入った方は、その日から自宅で芯を集めはじめた。ある日「これ使ってください」と大量に持ってきてくれた。芯が要るから、芯なしのトイレットペーパーは買わないのだという。</p>
        <p>「レクリエーションの時間が、その方の生活の中の次の楽しみにつながっていた。ここにこそ大きな意味があると思いました」</p>
      </div>

      <div class="chap">
        <div class="num">03</div>
        <h3>50日間、天井だけを見ていた</h3>
        <p>2020年9月、二階さんは突然倒れる。脳脊髄液漏出症。髄液が漏れて頭蓋骨を支えられなくなり、体を起こすと割れるように頭が痛む。ベッドは100%フラットにしなければならなかった。</p>
        <p>50日間、平らな天井だけを見て過ごした。</p>
        <p>「できていたことが突然できなくなりました。体だけじゃなくて、心も塞ぎがちになるんですね。でも私の場合、それは2日ぐらいだったんです。たぶんレクリエーションを学んでいたから、このままではあかんと思えたんでしょうね」</p>
        <p>入院生活だから仕方ない、と我慢するのをやめた。</p>
      </div>

      <blockquote>「入院していても、誰にでも快適に過ごす権利があるんだと思えたんです」</blockquote>

      <div class="chap">
        <p>その日から「入院生活を快適に」というタイトルで、毎日Facebookに投稿すると決めた。医師ではないから病気そのものは治せない。けれどストレスを減らすことや、ベッドの上の生活を少しでも快適にすることはできる。</p>
        <p>工夫は次々に生まれた。フラットのまま食事をすると、世界は平面しか見えない。ベッドサイドに置いたものは、角度がないと何が入っているのか見えない。ティッシュケースを3つ組み合わせて角度をつける台をつくった。3つなのは、中身を分けておけばバラバラにならないからだ。</p>
      </div>

      <figure>
        <img src="${IMG.c3}" alt="ティッシュケース3つを組み合わせて作った角度台">
        <figcaption>入院中に考案した台。ティッシュケースを3つ並べ、中身を分けて入れられるようにした。フラットに寝たままでも、この角度なら何が入っているか見える。</figcaption>
      </figure>

      <div class="chap">
        <p>トイレットペーパーは丸くて転がる。限られたベッドサイドの面積を取られたくない。洗濯バサミ4つで吊るす仕組みをつくった。掛け布団は朝までに必ず落ちる。落ちるたびにナースコールを押すことになるが、そんなことでは呼びたくない。敷布団を交換するための穴に紐を通し、ベッドのパイプに留めた。片側が固定されていれば落ちない。</p>
        <p>体を起こせるのは3秒だけ。その3秒でうつ伏せにひっくり返り、道具をつくった。</p>
        <p>4人部屋だった。隣の方から「私のところにも作って」と頼まれた。</p>
        <p>「みんな我慢しているんですよ。病院は病気を治してもらうところだから、そんなことを言ったらあかんという思いがあるんでしょうね。布団を拾ってほしいだけでナースコールは押しにくい。家だったら主人に『とって』と言えるのに」</p>
        <p>支えられる側になって、はじめて見えたことだった。</p>
      </div>

      <figure>
        <img src="${IMG.c4}" alt="笑顔で話す二階さん">
        <figcaption>「弱みが強みになったということですね。だからといって、皆さん入院してくださいというわけじゃないんですけど」</figcaption>
      </figure>

      <div class="chap">
        <div class="num">04</div>
        <h3>集団ではなく、集団の中の個人を見る</h3>
        <p>病気の前と後で、つくるレクリエーションはどう変わったか。</p>
        <p>「大きく変わりました。不自由な状態にある方の気持ちを、以前よりずっと具体的に想像できるようになりました」</p>
        <p>「重度の方にできるレクはない」「寝たきりの方にできるレクはない」。そう言われるのを耳にすることがある。</p>
        <p>「でも、自分が寝たきりを経験して、それは絶対に違うと思えるようになりました。できないことがあるなら、できる方法を探せばいいんです」</p>
        <p>以前、パーキンソン病の方と台風をテーマにしたセッションを行った。症状の一つに、手足の震えがある。二階さんはその方に太鼓を担当してもらった。小刻みに鳴る太鼓の音は、台風の中で雷がゴロゴロと鳴っているように聞こえた。周りから「すごい」と拍手が起こった。</p>
        <p>「その方の震えは、できないことではなくて、みんなで作る音楽の一部になったんです。弱みを消そうとするんじゃなくて、見方を変えて強みにする。これがレクリエーションにおけるアレンジ力だと思っています」</p>
        <p>見方を変える発想は、道具選びにも及ぶ。買い物では容器を見て選ぶ。ミニトマトの容器には、野菜が呼吸するための穴が開いている。水を入れれば漏れるから使いにくい——と見るか、穴から水が流れるのが面白い——と見るか。新聞紙を破って開けた穴も、一見すると失敗だが、二人で新聞を持って上に物を乗せ、落とさないように揺らすゲームになる。</p>
        <p>もう一つ、意識が変わったことがある。集団を見るのではなく、集団の中の個人を見るようになった。</p>
        <p>じゃんけんゲームでも、いきなり「負けるものを出してください」とは言わない。まず「私と同じものを出してください」から始める。その反応で、ルールを理解できているか、テンポよく出せるかがわかる。確認しながら、少しずつ難易度を上げていく。</p>
        <p>「最初からこの人にはこれ、と決めつけない。活動を通してその人を見て、その人に合わせてアレンジしていくんです」</p>
        <p>そして、集団だからこそ生まれる力がある。一人が笑ったこと、できたこと、発した言葉を、みんなで共有する。誰かが発した言葉は、オウム返しにもう一度言い直す。この方はこんな気持ちなんだ、とみんなで共有すると、その場の空気が温かくなる。</p>
      </div>

      <blockquote>「みんなで同じことをするだけが集団レクリエーションではありません。一人ひとりの喜びが、みんなの喜びにつながっていく。喜びは、こだまするんです」</blockquote>

      <div class="chap">
        <p>10年後については、AIの話をした。レクリエーションのアイデア出しや記録の整理は、大いにAIに助けてもらっていい。介護職員の人手不足が言われるなか、効率化できるところは効率化すべきだと考えている。</p>
        <p>「だからこそ、人にしかできないことがより大切になります。今日はこの方ちょっと元気ないな、このルールなら参加できそうかな、いまは声をかけるのを待ってみようかな。そういう小さな変化を感じ取って、その場で組み立てを変える。それは人にしかできません」</p>
        <p>必要なのはレクのネタを増やすことではない、と二階さんは言う。人を見る力と、その人に合わせて変えていくアレンジ力。</p>
        <p>「温もりですよ」</p>
      </div>

      <div class="msg">
        <div class="t">介護レクリエーションに関わる方へ</div>
        <p>レクのネタを見るのではなく、その人を見てほしいと思います。SNSで紹介されているレクをそのまま持ち込んでも、同じようにうまくいくとは限りません。参加する人が違うからです。集団が苦手な方には個別にできる方法を、身体機能に差があるならルールや難易度を。新しいネタをAIに聞くこと以上に、同じネタでもその人に合わせて変えられるアレンジ力を身につけてほしい。この人だからこうする。そこに介護レクリエーションの専門性があるんじゃないでしょうか。</p>
      </div>

      <div class="prof">
        <div class="pic"><img src="${IMG.card}" alt="二階喜美子さん"></div>
        <div>
          <h4>二階 喜美子</h4>
          <dl>
            <dt>協会での立場</dt><dd>一般社団法人日本アクティブコミュニティ協会 認定講師</dd>
            <dt>専門</dt><dd>音楽療法（日本音楽療法学会認定音楽療法士）／介護福祉士</dd>
            <dt>届けているもの</dt><dd>レクリエーションと音楽療法を融合した独自プログラム「音活クラブ」</dd>
            <dt>原点</dt><dd>50日間の寝たきりを経験したこと</dd>
          </dl>
        </div>
      </div>

      <div class="next">
        <div class="t">ほかの3名の記事を読む</div>
        <div class="row">
          <div class="item"><div class="ph">顔</div><span class="label">エビデンス</span><h5>平尾 麻衣子</h5></div>
          <div class="item"><div class="ph">顔</div><span class="label">越境</span><h5>近藤 真紀子</h5></div>

function ogp(){return `
<div style="max-width:1100px;width:100%">
  <div class="ogpbox">
    <h2>OGP画像　1200×630px</h2>
    <p>SNSシェア時に表示される画像です。サムネと同じカットから、SNS規格に合わせて別トリミングしています。文字は載せません（サムネイル表示では潰れて読めないため）。</p>
    <div class="img"><img src="${IMG.ogp}" alt="OGP"></div>
  </div>
  <div class="ogpbox">
    <h2>Indexカード用　3:2</h2>
    <p>一覧に並べたときに4名の構図が揃うよう、顔の位置を基準にトリミングしています。</p>
    <div class="img" style="max-width:400px"><img src="${IMG.card}" alt="カード"></div>
  </div>
</div>`}

function go(p){
  document.getElementById('root').innerHTML = p==='index'?index():p==='ogp'?ogp():article();
  document.querySelectorAll('[data-go]').forEach(b=>{ if(b.tagName==='BUTTON') b.setAttribute('aria-pressed', b.dataset.go===p); });
  window.scrollTo({top:0});
}
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-go]');
  if(t){e.preventDefault();go(t.dataset.go);return;}
  const d=e.target.closest('[data-dev-btn]');
  if(d){document.body.dataset.dev=d.dataset.devBtn;
    document.querySelectorAll('[data-dev-btn]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.devBtn===d.dataset.devBtn));}
});
go('art');
</script>
